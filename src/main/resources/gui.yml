  admin-line: "&c⚙ &7Quản trị"
  # Dòng cuối của icon Đệ Tử ({footer})
  minion-footer: "&e➜ Click để quản lý"
  # Dòng công cụ trong màn xác nhận trade
  trade-tool-line: "&8• &7Công cụ  {tool}"
  # Mũi tên "hiện tại → tiếp theo" trong nút nâng cấp
  next-arrow: " &8→ &a"
  state-on: "&aBật"
  state-off: "&cTắt"
  action-disable: "&e➜ Click để tắt"
  action-enable: "&e➜ Click để bật"
  action-upgrade: "&e➜ Click để nâng cấp"
  action-level-up: "&e➜ Click để tăng cấp"
  action-reclaim: "&c➜ Click để thu hồi"
  reclaim-unavailable: "&8Đang ở dạng item"
  max-reached: "&a✔ Đã tối đa"
  upgrade-max-reached: "&aĐã đạt cấp tối đa"
  level-max-tag: " &a(MAX)"
  upgrade-requirement: "&8• &7Yêu cầu &6{count}x Thẻ Nâng Cấp"
  # Tên các kiểu đầu ra
  output-none: "&7Thả ra ngoài"
  output-chest: "&6Rương/Kho"
  output-extra-storage: "&dExtraStorage"
  # Trạng thái kho ExtraStorage
  storage-allowed: "&aSẵn sàng"
  storage-full: "&cKho đầy"
  storage-disabled: "&cKho đang tắt"
  storage-user-unavailable: "&eChưa tải dữ liệu"
  storage-api-unavailable: "&cAPI không khả dụng"
  storage-unknown: "&eKhông xác định"
  # Tên loại Đệ Tử dùng trong form Bedrock ({type})
