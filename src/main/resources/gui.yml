  type-miner: "Khoáng Sản"
  # Trạng thái trong form Bedrock ({state})
  state-placed: "Đặt"
  state-item: "Túi"
  # Vị trí trong form Bedrock ({place})
  place-item: "Trong túi đồ"
  place-location: "({x},{y},{z}) {world}"

