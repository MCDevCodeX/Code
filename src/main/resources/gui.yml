# ==========================================================================
# gui.yml - TÊN, ẢNH CỦA TỪNG NÚT (CHUNG CHO JAVA VÀ BEDROCK)
# ==========================================================================
# Chỉ cần ghi những gì muốn đổi: khóa nào thiếu sẽ tự lấy giá trị mặc định trong plugin.
# Sửa xong dùng /detu reload (không cần restart).
#
# Mỗi nút (buttons.<nhóm>.<tên-nút>) có tối đa 2 phần:
#
#   java:      Giao diện rương (người chơi Java và Bedrock khi không có Floodgate)
#     material: tên Material (vd CHEST). "AUTO" = để plugin tự chọn theo ngữ cảnh.
#     name:     tên hiển thị, hỗ trợ mã màu &
#     lore:     danh sách dòng mô tả
#     custom-model-data: số CustomModelData (0 = không dùng) - dùng với resource pack
#     glow:     true = nhấp nháy như có enchant
#
#   bedrock:   Form Floodgate (người chơi Bedrock/PE)
#     name:        dòng chữ lớn của nút
#     description: dòng chữ nhỏ bên dưới (để "" nếu không cần)
#     image:       ảnh bên trái nút
#       type:  URL  = đường dẫn ảnh trên mạng (png/jpg), ví dụ https://example.com/chest.png
#              PATH = đường dẫn texture trong resource pack Bedrock, ví dụ textures/blocks/chest_front
#       value: để "" nếu không có ảnh
#     Lưu ý: ảnh URL phải truy cập được từ máy người chơi; ảnh PATH cần texture tồn tại ở client.
#
# Biến dùng trong chữ (đặt trong dấu ngoặc nhọn), nếu nút không có biến đó thì giữ nguyên:
#   minion.*      {level} {area} {speed} {output} {footer} | Bedrock: {state} {type} {place} {owner}
#   manage.*      {output} {state} {storage} {action} {tool} {level} {level_next} {max}
#                 {area} {area_next} {speed} {speed_next}
#   player.summary {owned} {max} {placed} {item_count}   admin.* {count} {total}
#   upgrade.*     {level} {level_status} {requirement} {action}
#   allowed.*     {item} {material} {material_lower}    trade.* {player} {sender}
#   Biến trong URL ảnh cũng dùng được, ví dụ cho nút trade.player:
#     value: "https://mc-heads.net/avatar/{player}"
# ==========================================================================

