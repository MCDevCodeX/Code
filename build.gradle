plugins {
    id 'java'
}

group = 'vn.disciples'
version = '0.13.0-universal'

// Compile bằng JDK 26 nhưng giữ bytecode Java 17 để plugin không bị khóa vào JVM 26.
// Minecraft 1.20.x trở lên có yêu cầu Java runtime riêng theo từng phiên bản server.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    // API nền 1.20.4; chỉ compileOnly, không đóng gói Paper API vào plugin.
    // Tránh gọi API mới hơn baseline để tăng khả năng chạy trên các bản 1.20+.
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.incremental = true
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'DiscipleMinions'
    archiveVersion = project.version.toString()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
